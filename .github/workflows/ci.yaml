name: CI

on:
  push:
    branches: [ "notification_ci" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'

      - name: Build with Gradle
        run: gradle clean build -x test

      - name: Get commit Id
        run: echo "COMMIT_ID=$(echo $COMMIT | cut -c1-8)" >> $GITHUB_ENV

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          echo "🔧 Building image: ${{ secrets.DOCKERHUB_USERNAME }}/notification_processor:$COMMIT_ID"
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/notification_processor:${COMMIT_ID} .

      - name: Push Docker image to DockerHub
        run: |
          echo " 📤 Pushing image: ${{ secrets.DOCKERHUB_USERNAME }}/notification_processor:$COMMIT_ID"
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/notification_processor:${COMMIT_ID} || { echo '❌ Image Push failed'; exit 1; }
          echo " ✅ Image pushed "
